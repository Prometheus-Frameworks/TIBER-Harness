name: CI

on:
  push:
    branches: ['**']
  pull_request:

# No secrets are referenced anywhere in this workflow by design:
# the harness runs entirely on MockProvider and makes no remote model calls.
permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run fixture evals (MockProvider, offline)
        run: npm test
